name: Build NhTBank Debug APK
run-name: Android Debug APK · ${{ github.ref_name }} · ${{ github.actor }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
concurrency:
  group: nhtbank-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Build web assets
        run: npm run build
      - name: Prepare Capacitor Android project
        run: |
          npm install --no-save --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK and checksum
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-artifact/NhTBank-Demo-debug.apk
          cd apk-artifact
          sha256sum NhTBank-Demo-debug.apk | tee apk-sha256.txt
          printf 'Commit: %s\nVariant: debug\nApp: vn.nhtbank.demo\n' "$BUILD_SHA" > build-info.txt
      - name: Summarize APK download
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          {
            printf '## NhTBank Android Debug APK\n\n'
            printf 'Commit: `%s`\n\n' "$BUILD_SHA"
            printf 'Download **NhTBank-Debug-APK** from the Artifacts section of this run (retained for 14 days).\n\n'
            printf 'Extract the ZIP, then install `NhTBank-Demo-debug.apk` on your Android test device.\n\n'
            printf 'Sandbox demo only. Debug APK; not a Play Store release. No real bank transactions.\n\n'
            printf 'Verify the extracted files with `sha256sum -c apk-sha256.txt`:\n\n```text\n'
            cat apk-artifact/apk-sha256.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NhTBank-Debug-APK
          path: |
            apk-artifact/
          if-no-files-found: error
          retention-days: 14
